[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardrail-rag-jev"
version = "0.1.0"
description = "Content guardrails for RAG: ingest, query, context and answer checks, Viet Nam law packs, review queue and audit log, with a pluggable judging model (Jev by default)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
guardrail-rag-jev = "guardrail_rag_jev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_rag_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
